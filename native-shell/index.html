<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HyperTrack</title>
  <!--
    Capacitor's webDir needs an index.html, but the native app loads
    server.url (https://hypertrack.app) instead, so this is never shown in
    normal use. If it ever is, fall through to the offline page, which
    retries the live app.
  -->
  <meta http-equiv="refresh" content="0; url=offline.html">
  <style>html, body { margin: 0; height: 100%; background: #0a0a0a; }</style>
</head>
<body></body>
</html>
