name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check raw .reps read ratchet
        run: npm run check:reps-access

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # One Jest run: the coverage run executes every test AND enforces the
      # thresholds in jest.config.js, so a separate plain `npm test` only
      # doubled the suite time.
      # NOTE: `next build` is intentionally not run here: it needs the
      # NEXT_PUBLIC_SUPABASE_* / Stripe env vars, which are not configured as
      # repository secrets. Vercel's own build covers it per deployment.
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage -- --ci

      # Fast simulation suite: all deterministic regression scenarios plus
      # 1 simulated month x 5 seeds per persona, against real engine code.
      # The full ~6-month x 50-seed sweep is run on demand / nightly:
      #   npm run simulate -- --full
      - name: Run simulation suite (fast)
        run: npm run simulate

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
